name: Validate Dependency Security (Pull Request)

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/dependency-security-pr.yml'
  push:
    branches: ['security/dependency-gate-**']

permissions:
  contents: read

jobs:
  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Audit high and critical vulnerabilities
        run: npm audit --audit-level=high
      - name: Run complete unit tests
        run: npm test
      - name: Run data migration and service boundaries checks (read only)
        run: |
          npm run infra:migrations:check
          npm run infra:boundaries:check
          npm run infra:openapi:check
      - name: Build static site
        run: npm run build
      - name: Check generated SEO output
        run: node scripts/check-seo-build.mjs
