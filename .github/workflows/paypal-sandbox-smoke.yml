name: PayPal Sandbox Order Smoke Test (No Capture)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox-order:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Test PayPal sandbox OAuth and create/read-only orders (no capture)
        run: node scripts/paypal-sandbox-preflight.mjs
        env:
          PAYPAL_SANDBOX_CLIENT_ID: ${{ secrets.PAYPAL_SANDBOX_CLIENT_ID }}
          PAYPAL_SANDBOX_CLIENT_SECRET: ${{ secrets.PAYPAL_SANDBOX_CLIENT_SECRET }}
