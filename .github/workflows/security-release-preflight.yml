name: Security Release Preflight (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify D1 migration readiness (no writes)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install locked CLI dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Validate migrations shipped on main
        run: npm run infra:migrations:check

      # Full tests and security audit run separately on draft PR #13.
      # The default branch still uses the old dependency lockfile, so
      # auditing it here would prevent the READ-ONLY remote preflight.

      - name: Check Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Configure CLOUDFLARE_API_TOKEN in Actions secrets"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Configure CLOUDFLARE_ACCOUNT_ID in Actions secrets"; exit 1; }

      - name: List unapplied migrations present on main (READ ONLY)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations list DB --remote

      - name: Read only — check database table names, never personal records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute DB --remote --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name IN ('report_jobs', 'transactions', 'report_templates', 'd1_migrations') ORDER BY name"

      - name: Inspect checkout-claim and retention table schema (READ ONLY)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute DB --remote --command "SELECT name FROM pragma_table_info('transactions') WHERE name IN ('checkout_token_hash', 'template_slug') ORDER BY name"
          npx wrangler d1 execute DB --remote --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name = 'retention_cleanup_runs'"

      - name: Explain execution boundary
        run: |
          echo "Read-only preflight complete. No D1/R2/PayPal/Worker changes were made. Migration file listing is relative to main; PR #13 migrations are reviewed separately."
          echo "Do not merge/deploy the security PR until the D1 migration, sandbox checkout and data-retention checks are approved."
