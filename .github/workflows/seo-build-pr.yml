name: Validate SEO Build (Pull Request)

on:
  push:
    branches: ['seo/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  seo-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Generate static site
        run: npm run build
      - name: Validate SEO output
        run: node scripts/check-seo-build.mjs
